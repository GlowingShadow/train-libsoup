<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 800" width="1150" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title    { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
    .boxtitle { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .code     { font-family: Consolas, Menlo, monospace; font-size: 11px; fill: #333; }
    .code10   { font-family: Consolas, Menlo, monospace; font-size: 10px; fill: #333; }
    .label    { font-size: 11px; font-style: italic; fill: #555; }
    .legend   { font-size: 11px; fill: #333; }
  </style>

  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ad1457"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1976d2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1150" height="800" fill="#ffffff"/>
  <text x="575" y="28" text-anchor="middle" class="title">libsoup API Server — Request Flow &amp; Module Structure</text>

  <!-- Client -->
  <rect x="475" y="50" width="200" height="44" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="575" y="77" text-anchor="middle" class="boxtitle">Client (curl)</text>

  <line x1="575" y1="94" x2="575" y2="128" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="588" y="115" class="label">HTTP request</text>

  <!-- GMainLoop + SoupServer -->
  <rect x="275" y="130" width="600" height="130" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="575" y="155" text-anchor="middle" class="boxtitle">GMainLoop → SoupServer</text>
  <text x="575" y="177" text-anchor="middle" class="code">soup_server_listen_local(server, 8080, 0, &amp;error)</text>
  <text x="575" y="196" text-anchor="middle" class="code">dispatches on socket event → builds a SoupServerMessage *msg</text>
  <text x="575" y="215" text-anchor="middle" class="code">parses "?k=v" into GHashTable *query</text>
  <text x="575" y="234" text-anchor="middle" class="code">matches request path against registered handlers</text>

  <line x1="575" y1="260" x2="575" y2="290" stroke="#555" stroke-width="2"/>
  <text x="588" y="280" class="label">soup_server_add_handler(path, fn, user_data, NULL)</text>

  <!-- Branch to handlers -->
  <line x1="575" y1="290" x2="150" y2="298" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="575" y1="290" x2="440" y2="298" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="575" y1="290" x2="730" y2="298" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="575" y1="290" x2="1020" y2="298" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Handler boxes -->
  <rect x="35"  y="300" width="230" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <rect x="325" y="300" width="230" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <rect x="615" y="300" width="230" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <rect x="905" y="300" width="230" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>

  <text x="150" y="325" text-anchor="middle" class="boxtitle">hello.c</text>
  <text x="150" y="345" text-anchor="middle" class="code">GET /api/hello</text>
  <text x="150" y="365" text-anchor="middle" class="code">only GET allowed</text>
  <text x="150" y="385" text-anchor="middle" class="code">else → 501</text>

  <text x="440" y="325" text-anchor="middle" class="boxtitle">echo.c</text>
  <text x="440" y="345" text-anchor="middle" class="code">GET /api/echo</text>
  <text x="440" y="365" text-anchor="middle" class="code">builds JSON via</text>
  <text x="440" y="385" text-anchor="middle" class="code">JsonBuilder/Generator</text>

  <text x="730" y="325" text-anchor="middle" class="boxtitle">items.c</text>
  <text x="730" y="345" text-anchor="middle" class="code">GET+POST /api/items/&lt;id&gt;</text>
  <text x="730" y="365" text-anchor="middle" class="code">parses id from path;</text>
  <text x="730" y="385" text-anchor="middle" class="code">POST body via JsonParser</text>

  <text x="1020" y="325" text-anchor="middle" class="boxtitle">state.c</text>
  <text x="1020" y="345" text-anchor="middle" class="code">GET+POST /api/state/a..d</text>
  <text x="1020" y="365" text-anchor="middle" class="code">user_data = AppState*</text>
  <text x="1020" y="385" text-anchor="middle" class="code">picks field by full path</text>

  <!-- Converge to shared utils -->
  <line x1="150"  y1="400" x2="575" y2="458" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="440"  y1="400" x2="575" y2="458" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="730"  y1="400" x2="575" y2="458" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="1020" y1="400" x2="575" y2="458" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Shared http utils -->
  <rect x="295" y="460" width="560" height="95" rx="10" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
  <text x="575" y="485" text-anchor="middle" class="boxtitle">src/http/ — shared response helpers</text>
  <text x="575" y="507" text-anchor="middle" class="code">http_respond_json_take() / http_respond_json_static()</text>
  <text x="575" y="525" text-anchor="middle" class="code">→ set_content_type + body_append + set_status</text>
  <text x="575" y="543" text-anchor="middle" class="code10">status.h: SOUP_STATUS_OK_200 / BAD_REQUEST_400 / NOT_FOUND_404 / NOT_IMPLEMENTED_501</text>

  <!-- Response path back to client -->
  <path d="M 855 500 C 1080 500, 1080 90, 677 72" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowBlue)"/>
  <text x="895" y="80" class="label" fill="#1976d2">HTTP response (status + JSON body)</text>

  <!-- main.c ownership box -->
  <rect x="35" y="600" width="320" height="120" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="195" y="625" text-anchor="middle" class="boxtitle">main.c</text>
  <text x="195" y="647" text-anchor="middle" class="code10">AppState app_state = {FALSE,FALSE,FALSE,FALSE};</text>
  <text x="195" y="667" text-anchor="middle" class="code10">GHashTable *items = g_hash_table_new_full(...);</text>
  <text x="195" y="687" text-anchor="middle" class="code10">registers 7 routes on one SoupServer</text>
  <text x="195" y="707" text-anchor="middle" class="code10">owns all handler state — no globals</text>

  <!-- Ownership arrows -->
  <path d="M 355 660 L 870 660 L 870 400" fill="none" stroke="#ad1457" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowPink)"/>
  <text x="878" y="540" class="label" fill="#ad1457">&amp;items (user_data)</text>

  <path d="M 355 685 L 1060 685 L 1060 400" fill="none" stroke="#ad1457" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowPink)"/>
  <text x="1068" y="540" class="label" fill="#ad1457">&amp;app_state (user_data)</text>

  <!-- Legend -->
  <rect x="35" y="745" width="16" height="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="56" y="756" class="legend">libsoup core</text>

  <rect x="185" y="745" width="16" height="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="206" y="756" class="legend">your handlers</text>

  <rect x="335" y="745" width="16" height="14" fill="#ede7f6" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="356" y="756" class="legend">shared HTTP/JSON helpers</text>

  <rect x="540" y="745" width="16" height="14" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="561" y="756" class="legend">main.c (owns state)</text>
</svg>
